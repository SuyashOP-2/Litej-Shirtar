 {id:"P002",age:61,gender:"M",weight:74,creat:1.2,egfr:70,liver:88,comorb:"Hypertension",drugs:"Lisinopril, Aspirin, Metformin"},
 {id:"P003",age:72,gender:"M",weight:68,creat:2.1,egfr:30,liver:75,comorb:"Diabetes, CKD",drugs:"Metformin, Ibuprofen, Lisinopril, Furosemide, Aspirin, Atorvastatin, Amlodipine, Pantoprazole"},
 {id:"P004",age:68,gender:"M",weight:80,creat:1.7,egfr:48,liver:70,comorb:"AF, Heart failure",drugs:"Warfarin, Aspirin, Amiodarone, Digoxin"},
 {id:"P005",age:55,gender:"F",weight:52,creat:1,egfr:82,liver:48,comorb:"Tuberculosis",drugs:"Isoniazid, Rifampicin, Paracetamol"}];
/* ---------- UI ---------- */
function Login({on}){
  const[e,setE]=useState("doctor@adrguard.com"),[p,setP]=useState("demo1234");
  return <div className="login">
    <div className="hero"><h1>Catch the reaction before the prescription is filled.</h1>
      <p>ADR Guard scores a patient’s risk, flags dangerous drug pairs, predicts severity, organ and timing, explains why, and suggests safer alternatives.</p>
      <svg className="pulse" viewBox="0 0 420 70"><polyline fill="none" stroke="#2fc4b2" strokeWidth="3" strokeLinejoin="round" points="0,40 90,40 110,40 125,10 145,62 160,40 250,40 270,40 285,22 300,50 312,40 420,40"/></svg></div>
    <div className="lwrap"><div className="lcard"><h2>Clinician sign in</h2><p className="mut" style={{marginTop:4}}>Demo mode: any email and password work.</p>
      <label>Email</label><input value={e} onChange={x=>setE(x.target.value)}/>
      <label>Password</label><input type="password" value={p} onChange={x=>setP(x.target.value)}/>
      <button className="btn" onClick={()=>on(e||"doctor@adrguard.com")}>Sign in</button></div></div></div>;
}
const Gauge=({v})=>{const d="M10 100A90 90 0 0 1 190 100";return <svg viewBox="0 0 200 122" className="gauge"><path d={d} fill="none" stroke="var(--bd)" strokeWidth="16" strokeLinecap="round"/><path d={d} fill="none" stroke={col(v/100)} strokeWidth="16" strokeLinecap="round" strokeDasharray={`${2.827*v} 300`}/><text x="100" y="92" textAnchor="middle" fontSize="40" fontWeight="700" fontFamily="Source Serif 4,serif" fill="var(--tx)">{v}</text><text x="100" y="114" textAnchor="middle" fontSize="12" fill="var(--mut)">APRS out of 100</text></svg>};
const TABS=["APRS score","Interactions & ADR","Multi-level prediction","Explainable AI","Prevention"];
function App(){
  const[user,setUser]=useState(null),[kv,setKv]=useState(0),[msg,setMsg]=useState(""),[pts,setPts]=useState(SAMPLE),[sel,setSel]=useState("P003"),[tab,setTab]=useState(0),[th,setTh]=useState(null);
  if(th)document.documentElement.dataset.theme=th;
  const p=pts.find(x=>x.id===sel)||pts[0];
  const A=useMemo(()=>analyze(p),[p,kv]);
  const all=useMemo(()=>Object.fromEntries(pts.map(q=>[q.id,aprsOnly(q)])),[pts,kv]);
  if(!user)return <Login on={setUser}/>;
  const set=(k,v)=>setPts(pts.map(q=>q.id===p.id?{...q,[k]:v}:q));
  const num=k=>e=>set(k,parseFloat(e.target.value)||0);
  const add=()=>{const id="P"+String(pts.length+1).padStart(3,"0");setPts([...pts,{id,age:50,gender:"M",weight:70,creat:1,egfr:80,liver:80,comorb:"",drugs:""}]);setSel(id)};
  return <div>
    <div className="top"><b>ADR Guard</b><span>{user}</span>
      <button className="btn s g" style={{color:"#e6eef0",borderColor:"#3b5361"}} onClick={()=>setTh((document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches))?"light":"dark")}>Theme</button>
      <button className="btn s g" style={{color:"#e6eef0",borderColor:"#3b5361"}} onClick={()=>setUser(null)}>Sign out</button></div>
    <div className="app">
      <div className="side card"><h3>Patients</h3>
        <div style={{maxHeight:"50vh",overflowY:"auto",display:"flex",flexDirection:"column",gap:8}}>{pts.map(q=><button key={q.id} className={"pt"+(q.id===p.id?" on":"")} onClick={()=>setSel(q.id)}><i style={{background:col(all[q.id]/100)}}>{all[q.id]}</i><span>{q.id}<small>{q.age} y, {q.gender}, {drugsOf(q).length} medicines</small></span></button>)}
        </div><button className="btn s g" onClick={add}>Add patient</button>
        <div style={{borderTop:"1px solid var(--bd)",paddingTop:10}}><b style={{fontSize:14}}>Load CSV data</b>{[["1. Patients","pt"],["2. Interactions","kb"],["5. Prevention","pv"]].map(([l,k])=><label key={k} style={{cursor:"pointer"}}>{l}<input type="file" accept=".csv" style={{display:"none"}} onChange={async e=>{const f=e.target.files[0];if(!f)return;const rows=parseCSV(await f.text());if(k==="pt"){const n=toPts(rows);if(n.length){setPts(n);setSel(n[0].id)}}else if(k==="kb")loadKB(rows);else loadPrev(rows);setKv(v=>v+1);setMsg(l+": "+rows.length+" rows loaded");e.target.value=""}}/><span className="btn s g" style={{display:"block",marginTop:4,textAlign:"center"}}>Choose file</span></label>)}<small className="mut">{msg}</small></div></div>
      <div>
        <div className="card"><h3>{p.id} patient data</h3>
          <div className="grid">
            <div><label>Age</label><input type="number" value={p.age} onChange={num("age")}/></div>
            <div><label>Gender</label><select value={p.gender} onChange={e=>set("gender",e.target.value)}><option>M</option><option>F</option></select></div>
            <div><label>Weight (kg)</label><input type="number" value={p.weight} onChange={num("weight")}/></div>
            <div><label>Creatinine</label><input type="number" step=".1" value={p.creat} onChange={num("creat")}/></div>
            <div><label>eGFR</label><input type="number" value={p.egfr} onChange={num("egfr")}/></div>
            <div><label>Liver score</label><input type="number" value={p.liver} onChange={num("liver")}/></div></div>
          <label>Medicines (comma separated)</label><input value={p.drugs} onChange={e=>set("drugs",e.target.value)}/><select value="" style={{marginTop:6}} onChange={e=>{if(e.target.value)set("drugs",(p.drugs?p.drugs+", ":"")+e.target.value)}}><option value="">+ Add a medicine from the list</option>{DRUGS.map(d=><option key={d}>{d}</option>)}</select>
          <label>Comorbidities</label><input value={p.comorb} onChange={e=>set("comorb",e.target.value)}/><select value="" style={{marginTop:6}} onChange={e=>{if(e.target.value)set("comorb",(p.comorb?p.comorb+", ":"")+e.target.value)}}><option value="">+ Add a disease from the list</option>{DISEASES.map(d=><option key={d}>{d}</option>)}</select></div>
        <div className="kpis">
          <div className="card kpi" style={{"--c":col(A.prob)}}><small>ADR probability</small><b>{Math.round(A.prob*100)}%</b></div>
          <div className="card kpi" style={{"--c":col(A.prob)}}><small>Severity</small><b>{A.sev}</b></div>
          <div className="card kpi"><small>Organ at risk</small><b>{A.organ}</b></div>
          <div className="card kpi"><small>Expected onset</small><b>≤ {A.days} days</b></div></div>
        <div className="tabs">{TABS.map((t,i)=><button key={t} className={"tab"+(tab===i?" on":"")} onClick={()=>setTab(i)}>{i+1}. {t}</button>)}</div>
        <div className="card" style={{marginTop:10}}>
          {tab===0&&<div className="row"><Gauge v={A.aprs}/><div className="tw"><h3 style={{marginBottom:8}}>How the score is built</h3><table><tbody>{A.parts.map(([l,v])=><tr key={l}><td>{l}</td><td style={{textAlign:"right",fontWeight:600}}>+{v}</td></tr>)}<tr><td><b>Total (capped at 100)</b></td><td style={{textAlign:"right"}}><b>{A.aprs}</b></td></tr></tbody></table></div></div>}
          {tab===1&&<div><h3 style={{marginBottom:8}}>Detected drug interactions</h3>
            {A.hits.length?<div className="tw"><table><thead><tr><th>Drug pair</th><th>Predicted ADR</th><th>Severity</th><th>Organ</th></tr></thead><tbody>{A.hits.map(h=><tr key={h[0]+h[1]}><td>{h[0]} + {h[1]}</td><td>{h[2]}</td><td><Sev s={h[3]}/></td><td>{h[4]}</td></tr>)}</tbody></table></div>:<p className="mut">No known interacting pair in this medicine list.</p>}
            <p className="mut" style={{fontSize:13,marginTop:14}}>Checked against {DDI.length} drug–drug pairs and {DIS.length} drug–disease rules, covering {DRUGS.length} medicines and {DISEASES.length} conditions. Production data would come from DrugBank DDI, TWOSIDES and FAERS.</p></div>}
          {tab===2&&<div><h3>Four predictions from one Random Forest</h3>
            <p className="mut">Inputs: age, gender, creatinine, eGFR, medicine count, interaction flag and APRS. The model is 30 decision trees (depth 6) trained in your browser on 700 simulated cases; two forests predict probability and onset time.</p>
            <div className="grid" style={{marginTop:12}}>{[["Probability",Math.round(A.prob*100)+"%"],["Severity",A.sev],["Organ",A.organ],["Time to ADR","Within "+A.days+" days"]].map(([k,v])=><div key={k} className="card"><small className="mut">{k}</small><div style={{font:"700 20px 'Source Serif 4',serif"}}>{v}</div></div>)}</div></div>}
          {tab===3&&<div><h3 style={{marginBottom:4}}>Why this prediction</h3><p className="mut" style={{margin:0}}>Exact Shapley (SHAP) values. Red pushes risk up, green pushes it down. Average baseline risk is {Math.round(A.base*100)}%.</p>
            <div style={{marginTop:10}}>{A.rank.map(r=>{const mx=Math.abs(A.rank[0].v)||1;return <div className="bar" key={r.i}><span>{r.label}</span><div className="t"><div style={{width:Math.abs(r.v)/mx*100+"%",background:r.v>=0?"var(--hi)":"var(--lo)"}}/></div><span style={{textAlign:"right"}}>{r.v>=0?"+":"−"}{Math.abs(r.v*100).toFixed(1)} pts</span></div>})}</div>
            <div className="why"><b>Risk {A.sev} because:</b> {A.why||"no feature raises risk above baseline"}</div></div>}
          {tab===4&&<div><h3 style={{marginBottom:10}}>Recommended actions</h3>{A.recs.map(r=><div className="act" key={r.type+r.pair}><b>{r.type}</b> <Sev s={r.sev}/> <span className="mut"> {r.pair}</span>
            <dl><dt>Action</dt><dd>{r.a[0]}</dd><dt>Monitoring</dt><dd>{r.a[1]}</dd><dt>Alternative drug</dt><dd>{r.a[2]}</dd></dl></div>)}
            <p className="mut" style={{fontSize:13}}>Decision support only. A clinician must confirm every change.</p></div>}
        </div></div></div></div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
